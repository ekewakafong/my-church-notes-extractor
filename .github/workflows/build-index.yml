name: Rebuild Notes Index

on:
  push:
    branches:
      - main
    paths:
      - "notes/**/*.md"
      - "tools/build-index.py"
      - "config/church-notes.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-index:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild INDEX.md
        run: python tools/build-index.py

      - name: Commit updated index
        run: |
          if git diff --quiet INDEX.md; then
            echo "INDEX.md is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add INDEX.md
          git commit -m "Update notes index"
          git push
